[project]
name = "logsherlock-backend"
version = "1.0.0"
description = "LogSherlock — evidence-backed AI log investigation backend"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
    # --- Web layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- Validation / settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Orchestration ---
    "langgraph>=0.2.50",
    # --- Persistence ---
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # --- HTTP client (model adapters, tests) ---
    "httpx>=0.27",
    # --- Model provider SDKs (one abstraction, several backends) ---
    "ollama>=0.4",
    "google-genai>=1.0",
    "openai>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "anyio>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -----------------------------------------------------------------------------
# Ruff — lint + format (SPEC §4.4)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "S",    # bandit — security rules
    "ASYNC",
    "D",    # pydocstyle
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's Depends() in argument defaults is the documented pattern.
"app/api/v1/*.py" = ["B008"]
"tests/*" = ["D100", "D101", "D102", "D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

# -----------------------------------------------------------------------------
# Pytest (SPEC §15)
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:langchain.*",
]
markers = [
    "slow: marks tests as slow",
]